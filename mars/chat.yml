name: 'chat'

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_AUTH=False
    volumes:
      - ${VOLUMES_BASEDIR}/open_webui/data:/app/backend/data
      - ${VOLUMES_BASEDIR}/open_webui/cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy_mars_network
      
