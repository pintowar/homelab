name: 'crawler'

services:
  fastcrw:
    image: ghcr.io/us/crw:latest
    container_name: fastcrw
    restart: unless-stopped
    environment:
      # Run the server on port 3000 inside the container
      - CRW_SERVER__PORT=3000
      # Select the renderer mode: 
      # "auto" (HTTP first, auto-detect SPAs, fall back to CDP) 
      # or "lightpanda" (force Lightpanda for all JS execution)
      - CRW_RENDERER__MODE=auto
      # Points the fastCRW engine to the Lightpanda CDP endpoint over the local Docker network
      - CRW_RENDERER__LIGHTPANDA__WS_URL=ws://lightpanda:9222
      - CRW_SEARCH__SEARXNG_URL=http://searxng:8080
      # (Optional) Restrict API access to authorized keys. Leave empty to allow unauthenticated access.
      - CRW_AUTH__API_KEYS=${CRW_AUTH__API_KEYS} # ["your-custom-api-key"]
      # (Optional) Configure an LLM API key for structured schemas /v1/extract
      # - CRW_EXTRACTION__LLM__API_KEY=sk-proj-...
    depends_on:
      - lightpanda
    # --- Hardening & Security Sandbox (Recommended for Production) ---
    read_only: true               # Keeps container filesystem immutable
    tmpfs:
      - /tmp                      # Writable scratchpad space for sandbox children
    cap_drop:
      - ALL                       # Eliminates unnecessary Linux capabilities
    security_opt:
      - no-new-privileges:true    # Prevents child processes from elevating privileges
    mem_limit: 2g                 # Standard system boundaries
    memswap_limit: 2g
    pids_limit: 512               # Thwarts fork-bomb/runaway worker exhaustion
    networks:
      - proxy_mars_network
      - fastcrw_internal

  lightpanda:
    image: docker.io/lightpanda/browser:latest
    container_name: lightpanda-browser
    # CRITICAL: This restart policy is load-bearing. LightPanda can crash/OOM 
    # on heavy/adversarial pages. If it fails, auto-restart prevents 
    # fastCRW from falling back to plain HTTP permanently.
    restart: unless-stopped
    environment:
      - LIGHTPANDA_DISABLE_TELEMETRY=true # Disables third-party usage data collection
    mem_limit: 1g
    networks:
      - fastcrw_internal

networks:
  proxy_mars_network:
    external: true
  fastcrw_internal:
    internal: true
