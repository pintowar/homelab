name: 'proxy'

services:
  nginx-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-manager
    restart: unless-stopped
    ports:
    # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
    volumes:
      - ${VOLUMES_BASEDIR}/nginx-manager/data:/data
      - ${VOLUMES_BASEDIR}/letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - earth_network

  dockhand:
    image: docker.io/fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    environment:
      - PUID=${PUID} # optional, your user id
      - PGID=${PGID} # optional, your group id
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLUMES_BASEDIR}/dockhand:/app/data
    networks:
      - earth_network

networks:
  earth_network:
    driver: bridge